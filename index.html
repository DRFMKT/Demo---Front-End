<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DFMC - Demonstração</title>
<style>
  :root { --bg:#14141f; --painel:#1d1d2d; --cartao:#252538; --linha:#34344d; --texto:#eceaf6; --suave:#9b99b5; --roxo:#7c6cf0; --alerta:#e0786a; color-scheme: dark; }
  :root[data-tema="light"] { --bg:#eceaf5; --painel:#ffffff; --cartao:#f4f3fa; --linha:#dad7ea; --texto:#1f1d2e; --suave:#6b6884; --roxo:#6a5ae0; --alerta:#c0483a; color-scheme: light; }
  @media (prefers-color-scheme: light) { :root:not([data-tema]) { --bg:#eceaf5; --painel:#ffffff; --cartao:#f4f3fa; --linha:#dad7ea; --texto:#1f1d2e; --suave:#6b6884; --roxo:#6a5ae0; --alerta:#c0483a; color-scheme: light; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--texto); font-family: "Segoe UI", system-ui, -apple-system, sans-serif; line-height: 1.5; }
  .etq { font-family: "Cascadia Mono", Consolas, ui-monospace, monospace; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--suave); margin: 0; }
  .caixa { width: 100%; max-width: 380px; background: var(--cartao); border: 1px solid var(--linha); border-radius: 18px; padding: 28px; }
  h1 { font-size: 1.7rem; margin: .1rem 0 .2rem; font-weight: 700; }
  .sub { color: var(--suave); margin: 0 0 1.2rem; }
  form { display: grid; gap: .9rem; }
  label { display: grid; gap: .3rem; color: var(--suave); font-size: .85rem; }
  input { width: 100%; background: var(--bg); border: 1px solid var(--linha); border-radius: 10px; padding: .6rem .8rem; color: var(--texto); font: inherit; }
  input:focus { outline: 2px solid var(--roxo); border-color: transparent; }
  button { background: var(--roxo); border: 0; border-radius: 10px; padding: .7rem 1rem; font: inherit; font-weight: 700; cursor: pointer; color: #fff; }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: .6; cursor: wait; }
  .aviso { background: rgba(224,120,106,.14); color: var(--alerta); border: 1px solid var(--alerta); border-radius: 10px; padding: .6rem .9rem; margin-bottom: 1rem; font-size: .9rem; }
  .treme { animation: treme .35s; }
  @keyframes treme { 20% { transform: translateX(-7px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
</style>
</head>
<body>
<div class="caixa" id="caixa">
  <p class="etq">DulFreitasMKT Consult</p>
  <h1>Nossas soluções</h1>
  <p class="sub">Entre com o seu usuário.</p>
  <div class="aviso" id="aviso" role="alert" hidden></div>
  <form id="form">
    <label>Usuário
      <input name="usuario" id="usuario" autocomplete="username" value="Demonstração" autofocus required>
    </label>
    <label>Senha
      <input name="senha" id="senha" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit" id="entrar">Entrar</button>
  </form>
</div>

  var VOLTAS = 600000;
  var raiz = document.documentElement;
  try {
    var t = localStorage.getItem("dfmc-demo-tema");
    if (t === "light") raiz.setAttribute("data-tema", "light");
    else if (t === "auto") raiz.removeAttribute("data-tema");
    else raiz.setAttribute("data-tema", "dark");

  function norm(u) { return u.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
  function bytes(b64) { var bin = atob(b64), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
  function avisar(msg) {
    var a = document.getElementById("aviso"), c = document.getElementById("caixa");
    a.textContent = msg; a.hidden = false;
    c.classList.remove("treme"); void c.offsetWidth; c.classList.add("treme");
  }
  async function destravar(usuario, senha) {
    var d = bytes(PAYLOAD), sal = d.slice(0, 16), iv = d.slice(16, 28), cifrado = d.slice(28);
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(norm(usuario) + "\n" + senha), "PBKDF2", false, ["deriveKey"]);
    var chave = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: sal, iterations: VOLTAS, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);

  try {
    if (location.hash.length > 1) {
      document.getElementById("senha").value = decodeURIComponent(location.hash.slice(1));
      history.replaceState(null, "", location.pathname + location.search);
      document.getElementById("entrar").focus();
    }
  } catch (e) { /* sem preenchimento automatico: digite a senha */ }
  document.getElementById("form").addEventListener("submit", async function (e) {
    e.preventDefault();
    var botao = document.getElementById("entrar");
    if (!window.crypto || !crypto.subtle) { avisar("Este navegador não consegue abrir a demonstração. Use o Chrome, o Edge ou o Firefox atualizados."); return; }
    botao.disabled = true; botao.textContent = "Entrando...";
